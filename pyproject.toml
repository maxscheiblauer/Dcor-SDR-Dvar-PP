[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpp-thesis-reproduction"
version = "1.0.0"
description = "Reproduction code for a thesis on projection pursuit with distance-based dependence measures"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "joblib>=1.4",
    "dcor>=0.6",
    "POT>=0.9",
    "xlrd>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
